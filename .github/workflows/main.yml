name: build-and-push-to-acr

on:
  push:
    branches: [ "main", "master", "release/*" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_REGISTRY: crpi-he7mqvhihpnvi08o.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: edu-agent-project
  ACR_REPO: edu-agent-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            TAG_LATEST=latest
          else
            TAG_LATEST=""
          fi

          FULL_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"

          TAGS="${FULL_IMAGE}:${SHORT_SHA}
          ${FULL_IMAGE}:${BRANCH}"

          if [ -n "$TAG_LATEST" ]; then
            TAGS="${TAGS}
          ${FULL_IMAGE}:latest"
          fi

          {
            echo "short_sha=${SHORT_SHA}"
            echo "full_image=${FULL_IMAGE}"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: AmazingYe-oss/edu-agent-service-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in kustomization
        working-directory: gitops/base
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"
          TAG="${{ needs.build-and-push.outputs.image_tag }}"

          sed -i "s|newName:.*|newName: ${IMAGE}|" kustomization.yaml
          sed -i "s|newTag:.*|newTag: ${TAG}|" kustomization.yaml

          echo "Updated image tag to: ${TAG}"

      - name: Commit and push changes
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add base/kustomization.yaml
          git commit -m "chore: update image tag to ${{ needs.build-and-push.outputs.image_tag }}"
          git push
